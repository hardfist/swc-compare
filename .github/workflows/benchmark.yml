name: Benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Node.js ${{ matrix.node-version }} / ${{ matrix.fixture }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 24.x]
        fixture: [many-modules, large-file]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify SWC versions
        run: pnpm verify:versions

      - name: Run benchmark smoke test
        run: pnpm bench
        env:
          BENCH_FIXTURE: ${{ matrix.fixture }}
          BENCH_MODULES: 500
          BENCH_LARGE_FILE_BYTES: 262144
          BENCH_WARMUPS: 2
          BENCH_RUNS: 6

      - name: Analyze benchmark results
        run: pnpm analyze

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ matrix.fixture }}-node-${{ matrix.node-version }}
          path: |
            .benchmark-workload/results.json
            .benchmark-workload/analysis.json
          if-no-files-found: ignore
          retention-days: 14
